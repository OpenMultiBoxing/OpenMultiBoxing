# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run.
on:
  push:
    tags:
      - 'v*'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: windows-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Checkout tools repo
        uses: actions/checkout@v2
        with:
          repository: OpenMultiBoxing/BuildKit
          path: buildkit

      - name: Get and set the version
        id: get_version
        run: |
          VERSION=${GITHUB_REF/refs\/tags\//}
          if [[ "${VERSION}" == "refs/heads/main" ]]; then
            VERSION=dev-pre
          fi
          echo ::set-output name=VERSION::${VERSION}
          echo "Version=\"$VERSION\""
          if [ -z "${VERSION##*pre*}" ]; then
            echo ::set-output name=PRERELEASE::true
          else
            echo ::set-output name=PRERELEASE::false
          fi
          sed -i -e "s/^set vers .*$/set vers \"$VERSION\"/" OpenMultiBoxing.tcl
          # _RR not used/needed anymore but keeping for ref.
          sed -b -e "s/OpenMultiBoxing-vX.Y.Z.exe/OpenMultiBoxing-$VERSION.exe/" buildkit/OpenMultiBoxing_RR.exe > buildkit/OpenMultiBoxing_RR-$VERSION.exe
        shell: bash

      - name: Make the executable and zip
        run: |
          cd buildkit
          cp ..\OpenMultiBoxing.tcl OpenMultiBoxing.vfs\app\
          .\build.ps1 -Out OpenMultiBoxing-${{ steps.get_version.outputs.VERSION }}.exe -Version ${{ steps.get_version.outputs.VERSION }}
          Compress-Archive -Path OpenMultiBoxing-${{ steps.get_version.outputs.VERSION }}.exe,..\README.txt,..\*.bat -DestinationPath OpenMultiBoxing-${{ steps.get_version.outputs.VERSION }}.zip

      - name: Make the Microsoft Store package
        run: |
          msix\pack.ps1 -Exe buildkit\OpenMultiBoxing-${{ steps.get_version.outputs.VERSION }}.exe -Version ${{ steps.get_version.outputs.VERSION }} -Out OpenMultiBoxing-${{ steps.get_version.outputs.VERSION }}.msix


      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: ${{ github.ref }}
          release_name: OpenMultiBoxing ${{ steps.get_version.outputs.VERSION }}
          draft: true
          prerelease: ${{ steps.get_version.outputs.PRERELEASE }}

      - name: Upload Zip
        id: upload-release-asset1
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
          asset_path: .\buildkit\OpenMultiBoxing-${{ steps.get_version.outputs.VERSION }}.zip
          asset_name: OpenMultiBoxing-${{ steps.get_version.outputs.VERSION }}.zip
          asset_content_type: application/zip

      - name: Upload Update Code
        id: upload-release-asset2
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
          asset_path: OpenMultiBoxing.tcl
          asset_name: OpenMultiBoxing-${{ steps.get_version.outputs.VERSION }}.tcl
          asset_content_type: application/octet-stream

      # Not a release asset (users get it from the Store): in the run's artifacts, for manual submissions
      - name: Keep the Store package
        uses: actions/upload-artifact@v4
        with:
          name: OpenMultiBoxing-${{ steps.get_version.outputs.VERSION }}.msix
          path: OpenMultiBoxing-${{ steps.get_version.outputs.VERSION }}.msix

      # New Store submission for real releases (not -pre), certified then published per its Partner Center options
      - name: Setup Microsoft Store Developer CLI
        if: steps.get_version.outputs.PRERELEASE == 'false'
        uses: microsoft/microsoft-store-apppublisher@v1.1
      - name: Submit to the Microsoft Store
        if: steps.get_version.outputs.PRERELEASE == 'false'
        run: |
          msstore reconfigure --tenantId ${{ secrets.MSSTORE_TENANT_ID }} --sellerId ${{ secrets.MSSTORE_SELLER_ID }} --clientId ${{ secrets.MSSTORE_CLIENT_ID }} --clientSecret ${{ secrets.MSSTORE_CLIENT_SECRET }}
          msstore publish OpenMultiBoxing-${{ steps.get_version.outputs.VERSION }}.msix -id 9N0DZ59NL2DW
